<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>成长追踪冒烟测试</title>
  <style>
    body{margin:0;font:16px/1.5 system-ui;background:#f5f8fc;color:#182230}
    main{max-width:760px;margin:32px auto;padding:20px}
    iframe{width:100%;height:520px;border:1px solid #dbe3ee;border-radius:8px;background:#fff}
    li{margin:8px 0;padding:10px 12px;background:#fff;border:1px solid #dbe3ee;border-radius:7px}
    .pass{color:#087f5b}.fail{color:#c83c42}
  </style>
</head>
<body>
  <main>
    <h1>成长追踪冒烟测试</h1>
    <ol id="results"><li>正在加载应用并检查……</li></ol>
    <iframe id="app" src="./growth_tracker.html"></iframe>
  </main>
  <script>
    const iframe=document.getElementById('app');
    iframe.addEventListener('load',()=>setTimeout(()=>{
      const results=iframe.contentWindow.GrowthStability?.runSmokeTests?.()||[
        {name:'稳定性模块已加载',passed:false}
      ];
      document.getElementById('results').innerHTML=results.map(result=>
        `<li class="${result.passed?'pass':'fail'}">${result.passed?'通过':'失败'}：${result.name}</li>`
      ).join('');
    },1200));
  </script>
</body>
</html>
