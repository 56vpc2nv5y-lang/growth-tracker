<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="成长追踪"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f6cbd"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" type="image/png" href="./app-icon-192.png"/>
<link rel="apple-touch-icon" href="./app-icon-192.png"/>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<title>个人成长追踪</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','SF Pro Display',-apple-system,'Segoe UI',sans-serif;background:#f5f8fc;color:#17233a;min-height:100vh;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f8fc;--sf:#ffffff;--sf2:#f7f9fc;--bd:#dde5ef;--bd2:#e9eef5;
  --t1:#17233a;--t2:#66758a;--t3:#98a5b5;
  --fi:#0f6cbd;--fi-l:#eaf4ff;
  --le:#7160b8;--le-l:#f1effb;
  --wo:#d66b3d;--wo-l:#fff1ea;
  --sc:#1683c7;--sc-l:#e8f6ff;
  --gr:#2d9b65;--re:#d64545;--am:#e3a325;
  --sh:0 1px 2px rgba(30,64,110,.04),0 5px 18px rgba(30,64,110,.055);
  --shd:0 14px 34px rgba(30,64,110,.13);
  --r:12px;--rs:8px
}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--bd);margin-bottom:12px}
.card.flat{background:var(--sf2);box-shadow:none;border-color:var(--bd2)}
.card.deep{box-shadow:var(--shd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:var(--rs);padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border:1.5px solid;white-space:nowrap;transition:opacity .12s;-webkit-tap-highlight-color:transparent;line-height:1}
.btn:active{opacity:.65}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 13px;font-size:13px}.btn.xs{padding:4px 10px;font-size:12px}
.btn.full{width:100%}
.btn.fi{background:var(--fi);color:#fff;border-color:var(--fi)}
.btn.le{background:var(--le);color:#fff;border-color:var(--le)}
.btn.wo{background:var(--wo);color:#fff;border-color:var(--wo)}
.btn.sc{background:var(--sc);color:#fff;border-color:var(--sc)}
.btn.gr{background:var(--gr);color:#fff;border-color:var(--gr)}
.btn.pu{background:#0f6cbd;color:#fff;border-color:#0f6cbd}
.btn.ofi{background:transparent;color:var(--fi);border-color:var(--fi)}
.btn.ole{background:transparent;color:var(--le);border-color:var(--le)}
.btn.owo{background:transparent;color:var(--wo);border-color:var(--wo)}
.btn.osc{background:transparent;color:var(--sc);border-color:var(--sc)}
.btn.oai{background:transparent;color:#7160b8;border-color:#b8afe0}
.btn.omi{background:transparent;color:var(--t2);border-color:var(--bd)}
.btn.ore{background:transparent;color:var(--re);border-color:var(--re)}
input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;padding:10px 13px;border-radius:var(--rs);border:1.5px solid var(--bd);font-size:16px;outline:none;font-family:inherit;background:var(--sf2);transition:border-color .2s,background .15s;resize:vertical;-webkit-appearance:none}
input:not([type=checkbox]):focus,textarea:focus{border-color:var(--fi);background:var(--sf)}
input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--fi)}
input[type=color]{padding:3px 5px;height:40px;cursor:pointer}
.bar-t{background:var(--bd);border-radius:99px;overflow:hidden}
.bar-f{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd2);gap:8px}
.row:last-child{border-bottom:none}
.del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:18px;padding:2px 5px;line-height:1;flex-shrink:0}
.chip{padding:6px 13px;border-radius:99px;cursor:pointer;font-size:13px;font-family:inherit;border:1.5px solid;transition:all .12s}
.empty{text-align:center;padding:28px 0;color:var(--t3);font-size:13px;line-height:1.7}
.shd{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:10px}
.sub{font-size:11px;color:var(--t3);margin-top:2px}
.stitle{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:999;overflow-y:auto}
@media(min-width:520px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--sf);border-radius:20px 20px 0 0;padding:24px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal{border-radius:20px}}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}.blk{animation:blink 1.2s infinite}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.up{animation:up .22s ease}

/* ── Salary Hero ─ */
.sal-hero{background:linear-gradient(135deg,#0f6cbd 0%,#2389d7 58%,#54b4e8 100%);border-radius:var(--r);color:#fff;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}
.sal-hero::after{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05)}
.sal-hero::before{content:'';position:absolute;bottom:-60px;left:-20px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.04)}

/* ── Countdown cards ─ */
.cdn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:0}
.cdn-item{background:var(--sf);border-radius:13px;padding:14px 12px;border:1px solid var(--bd);text-align:center;position:relative;box-shadow:var(--sh);cursor:default}
.cdn-item.trial{border-color:#a9cfff;background:linear-gradient(135deg,#eef6ff,#f4f0ff)}
.cdn-num{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1;margin:6px 0 4px}
.cdn-del{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1}

/* ── Wishlist ─ */
.wish{display:flex;align-items:center;gap:13px;padding:13px;background:var(--sf2);border-radius:13px;margin-bottom:8px;border:1px solid var(--bd2)}

/* ── Goal Card (Learning) ─ */
.goal-card{background:var(--sf);border-radius:0 var(--r) var(--r) 0;border:1px solid var(--bd);border-left:3px solid var(--le);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.goal-card:hover{box-shadow:var(--shd)}
.goal-pct{font-size:30px;font-weight:700;line-height:1;letter-spacing:0}
.goal-card.done{border-left-color:var(--gr);opacity:.75}

/* ── Timeline (logs) ─ */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--bd2);border-radius:99px}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-19px;width:10px;height:10px;border-radius:50%;top:3px;border:2.5px solid var(--sf);box-shadow:0 0 0 1px var(--bd)}

/* ── Priority Todos ─ */
.todo-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd2);gap:8px}
.todo-row:last-child{border-bottom:none}
.prio-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0}

/* ── Calendar ─ */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cday{min-height:38px;padding:4px 2px;border-radius:9px;cursor:pointer;position:relative;transition:background .12s}
.cday:hover{background:var(--sf2)}
.cday.td{background:var(--fi-l)}
.cday.td .cn{color:var(--fi);font-weight:700}
.cn{font-size:13px;text-align:center}
.cday.ot .cn{color:var(--t3)}
.evdot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.dot{width:4px;height:4px;border-radius:50%}

/* ── Multi-day timeline ─ */
.timeline-card{padding:0;overflow:hidden}
.timeline-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd2);flex-wrap:wrap}
.timeline-scroll{overflow:auto;max-height:72vh;background:#fff;scrollbar-width:thin}
.timeline-grid{display:grid;grid-template-columns:58px repeat(var(--days),132px);grid-template-rows:54px auto;width:max-content;min-width:100%}
.tl-corner{position:sticky;left:0;top:0;z-index:8;background:#fff;border-right:1px solid #e6eaf0;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t3)}
.tl-day-head{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-right:1px solid #e6eaf0;border-bottom:1px solid #e6eaf0;text-align:center;padding:8px 4px}
.tl-day-head.today{background:#eaf4ff;color:var(--fi)}
.tl-time-col{position:sticky;left:0;z-index:5;background:#fff;border-right:1px solid #e6eaf0;height:896px}
.tl-time{height:56px;padding:0 7px;text-align:right;font-size:10px;color:var(--t3);transform:translateY(-6px)}
.tl-day-body{height:896px;position:relative;border-right:1px solid #e6eaf0;background:repeating-linear-gradient(to bottom,#fff 0,#fff 55px,#edf0f4 55px,#edf0f4 56px)}
.tl-day-body.today{background:repeating-linear-gradient(to bottom,#f5faff 0,#f5faff 55px,#d9ebfb 55px,#d9ebfb 56px)}
.tl-slot{height:56px;position:relative;pointer-events:none}
.tl-day-body{cursor:crosshair}
.tl-day-body.placing{box-shadow:inset 0 0 0 2px #0f6cbd;background:repeating-linear-gradient(to bottom,#eef7ff 0,#eef7ff 27px,#d9ebfb 27px,#d9ebfb 28px)}
.tl-event{position:absolute;left:5px;right:5px;z-index:3;border-radius:8px;padding:5px 6px;overflow:hidden;border-left:3px solid;font-size:10px;line-height:1.35;box-shadow:0 2px 8px rgba(15,23,42,.10);cursor:pointer}
.tl-event.dragging{opacity:.84;outline:2px dashed #0f6cbd;z-index:10;will-change:transform,height;pointer-events:none}
.tl-resize-y{position:absolute;left:5px;right:5px;bottom:0;height:10px;cursor:ns-resize;background:linear-gradient(transparent,rgba(15,108,189,.23))}
.tl-resize-y::after{content:'';position:absolute;left:50%;bottom:2px;width:20px;height:2px;border-radius:9px;background:currentColor;opacity:.28;transform:translateX(-50%)}
.tl-resize-x{position:absolute;right:0;top:16px;bottom:10px;width:12px;cursor:ew-resize;background:linear-gradient(90deg,transparent,rgba(15,108,189,.25))}
.tl-resize-x::after{content:'';position:absolute;right:3px;top:50%;width:2px;height:18px;border-radius:9px;background:currentColor;opacity:.32;transform:translateY(-50%)}
.tl-event:hover .tl-resize-y,.tl-event:hover .tl-resize-x{background-color:rgba(255,255,255,.25)}
.tl-event.multi{box-shadow:inset -2px 0 rgba(15,108,189,.36),0 2px 8px rgba(30,64,110,.10)}
.tl-all-day{padding:8px 16px;border-bottom:1px solid var(--bd2);display:flex;gap:6px;align-items:center;overflow-x:auto;background:#f8fafc}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emoji-btn{height:34px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.emoji-btn.on{border-color:#7160b8;background:#f1effb}
.wish-goal{border-left:4px solid #7160b8}
.form-label{font-size:11px;color:var(--t2);font-weight:700;margin-bottom:4px}
.tl-event strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-event.focus{background:#f1effb;border-color:#7160b8;color:#4f428c}
.tl-event.meeting{background:#eaf4ff;border-color:#0f6cbd;color:#095a9f}
.tl-event.rest{background:#eaf8f0;border-color:#2d9b65;color:#247a50}
.tl-event.life{background:#fff1ea;border-color:#d66b3d;color:#a64e29}
.tl-event.done{opacity:.58;filter:saturate(.65)}
.tl-event.done strong{text-decoration:line-through}
.tl-event.conflict{outline:2px solid rgba(220,38,38,.28)}
.tl-check{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;position:absolute;right:4px;top:4px;font-size:10px;font-weight:900;cursor:pointer}
.tl-event strong{padding-right:17px}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:600;background:#f8fafc;border:1px solid var(--bd)}
.insight{padding:11px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e6eaf0;font-size:12px;line-height:1.6;color:#475569}
.trip-card{border-left:4px solid #1683c7}
.explore-card{border-left:4px solid #d45b91}
.tl-now{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:4;pointer-events:none}
.tl-now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444}

/* ── Gantt ─ */
.gt-row{display:flex;align-items:center;margin-bottom:9px}
.gt-lbl{width:108px;font-size:11px;color:var(--t2);padding-right:8px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-track{flex:1;position:relative;height:24px;background:var(--sf2);border-radius:6px;overflow:hidden;border:1px solid var(--bd2)}
.gt-bar{position:absolute;height:100%;border-radius:5px;display:flex;align-items:center;padding:0 6px;font-size:10px;color:rgba(255,255,255,.9);font-weight:600;white-space:nowrap;overflow:hidden}

/* ── Toast ─ */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(90px);z-index:9999;background:#17233a;color:#fff;padding:12px 18px;border-radius:99px;font-size:13px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 20px rgba(30,64,110,.22);display:flex;align-items:center;gap:10px;opacity:0;visibility:hidden}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#toast button{border:0;border-radius:99px;padding:5px 10px;background:#fff;color:#172033;font:inherit;font-size:12px;font-weight:600;cursor:pointer;pointer-events:auto}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c8ced8;border-radius:99px}
code{font-family:monospace;font-size:11px;background:var(--sf2);padding:2px 6px;border-radius:5px;word-break:break-all}

/* ── Refined visual system ─ */
body{background:var(--bg);color:var(--t1)}
.card{border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);background:var(--sf);padding:18px}
.card.flat{background:var(--sf2);border-color:var(--bd2);box-shadow:none}
.btn{border-radius:var(--rs);box-shadow:none;font-weight:600;transition:transform .04s ease,filter .15s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn.fi{box-shadow:0 1px 2px rgba(15,108,189,.25)}
.btn.sm,.btn.xs{border-radius:9px;font-weight:600}
input:not([type=checkbox]):not([type=color]),textarea,select{background:#fff;border:1.5px solid var(--bd);border-radius:var(--rs);transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):focus,textarea:focus,select:focus{border-color:var(--fi);box-shadow:0 0 0 3px rgba(15,108,189,.13)}
.chip{border-radius:99px}

/* brand header — bright, optimistic Fluent-inspired anchor */
.brand-head{background:linear-gradient(112deg,#e7f3ff 0%,#f6faff 60%,#fff8e8 100%)!important;color:#17233a!important;border-top:4px solid #0f6cbd!important;border-bottom:1px solid #d8e7f5!important;box-shadow:0 7px 24px rgba(30,94,150,.09)!important}
.brand-head .brand-date{color:#66758a!important;letter-spacing:.2px}
.brand-head .brand-title{color:#15345a!important;font-weight:700!important;letter-spacing:0!important}
.brand-head .brand-settings{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:#fff!important;border:1px solid #d4e3f2!important;color:#0f6cbd!important;border-radius:9px!important;box-shadow:0 2px 6px rgba(30,94,150,.08)}
.brand-mark{width:40px;height:40px;border-radius:10px;box-shadow:0 4px 12px rgba(15,108,189,.18);flex-shrink:0}
.quote-strip{background:rgba(255,255,255,.78)!important;border:1px solid #d8e7f5!important;border-left:3px solid #49a6e9!important;backdrop-filter:blur(8px);border-radius:10px!important}
.quote-strip .quote-text{color:#34455f!important;font-weight:500;opacity:1}
.quote-strip .quote-author{color:#7a8aa0!important}
.quote-strip .quote-refresh,.quote-icon{color:#0f6cbd!important}
.brand-icon,.quote-icon,.quote-refresh,.nav-icon{display:inline-flex;align-items:center;justify-content:center}
.brand-icon svg,.quote-icon svg,.quote-refresh svg,.nav-icon svg{width:16px;height:16px;stroke-width:1.8}
.top-nav{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid #e2eaf3;position:sticky;top:0;z-index:100}
.nav-tab{flex:1;min-width:80px;padding:10px 8px 9px;background:none;border:0;border-bottom:2px solid transparent;color:var(--t3);font-weight:500;cursor:pointer;font-size:12px;font-family:inherit;transition:color .16s,border-color .16s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-tab.active{color:var(--tab-color);border-bottom-color:var(--tab-color)}
.nav-tab .nav-icon{width:27px;height:27px;border-radius:9px;background:transparent;color:inherit;transition:background .16s}
.nav-tab.active .nav-icon{background:color-mix(in srgb,var(--tab-color) 12%,white)}

/* module hero — clean white card with a colored kicker dot + top accent */
.module-hero{border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;color:var(--t1);border:1px solid var(--bd);box-shadow:var(--sh);background:#fff;border-top:3px solid var(--accent,var(--fi))}
.module-hero::after{display:none}
.module-hero.home{--accent:#0f6cbd}
.module-hero.fin{--accent:var(--fi)}
.module-hero.learn{--accent:var(--le)}
.module-hero.work{--accent:var(--wo)}
.module-hero.sch{--accent:var(--sc)}
.module-hero.life{--accent:#d45b91}
.module-hero.sch{display:none}
.module-kicker{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent,var(--t2));margin-bottom:6px;display:flex;align-items:center;gap:7px}
.module-kicker::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--accent,var(--fi))}
.module-title{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:0}

/* metric cards */
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.metric{background:var(--sf2);border:1px solid var(--bd2);border-radius:13px;padding:13px;min-width:0}
.metric .num{font-size:21px;font-weight:700;letter-spacing:-.5px;color:var(--t1);font-variant-numeric:tabular-nums}
.metric .lbl{font-size:10.5px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* finance focal card — Outlook blue with a crisp, optimistic hierarchy */
.core-card{background:linear-gradient(135deg,#0f6cbd 0%,#2389d7 62%,#55b5e8 100%)!important;color:#fff!important;border:0!important;box-shadow:0 12px 30px rgba(15,108,189,.22)!important}
.core-card .module-kicker,.core-card .sub{color:rgba(255,255,255,.82)!important}
.core-card .module-kicker::before{background:#ffe18a}
.core-card .primary-number{color:#fff!important}
.core-card .soft-status{background:rgba(255,255,255,.16)!important;color:#fff!important;border-color:rgba(255,255,255,.25)!important}
.core-card .btn{background:rgba(255,255,255,.94)!important;border-color:rgba(255,255,255,.8)!important;color:#0f6cbd!important}
.primary-number{font-size:36px!important;font-weight:800!important;line-height:1.05;letter-spacing:-1px!important;font-variant-numeric:tabular-nums}
.finance-main-budget{background:#fff!important}
.finance-main-record{background:#fff!important;border-color:#d9e6f3!important}
.finance-main-budget .bucket-line{background:#f7faff}

/* sections / goals / hero(legacy) */
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.section-head .shd{margin:0;font-size:14px;font-weight:700}
.section-note{display:none}

const stripJsonTrailingCommas=text=>{
  let out='',inString=false,escaped=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inString){out+=ch;if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch==='"')inString=false;continue;}
    if(ch==='"'){inString=true;out+=ch;continue;}
    if(ch===','){let j=i+1;while(/\s/.test(text[j]||''))j++;if(text[j]===']'||text[j]==='}')continue;}
    out+=ch;
  }
  return out;
};
const parseAIJson=raw=>{
  const text=String(raw??'').replace(/^\uFEFF/,'').trim(),starts=[];
  for(let i=0;i<text.length;i++)if(text[i]==='['||text[i]==='{')starts.push(i);
  for(const start of starts){
    const stack=[],open=text[start];let inString=false,escaped=false;
    for(let i=start;i<text.length;i++){
      const ch=text[i];
      if(inString){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch==='"')inString=false;continue;}
      if(ch==='"'){inString=true;continue;}
      if(ch==='['||ch==='{')stack.push(ch);
      else if(ch===']'||ch==='}'){
        const expected=ch===']'?'[':'{';if(stack.pop()!==expected)break;
        if(!stack.length){
          const candidate=text.slice(start,i+1),cleaned=stripJsonTrailingCommas(candidate);
          try{return JSON.parse(candidate);}catch{try{return JSON.parse(cleaned);}catch{}}
          break;
        }
      }
    }
  }
  throw new Error('AI 返回中没有可用的 JSON');
};

const normalizeCat=x=>{
  let cat=String(x.category||x.cat||'');
  const n=String(x.note||x.merchant||'');
  if(!cat||cat==='other'){
    if(FOOD_RE.test(n))cat='food';
    else if(TRANSIT_RE.test(n))cat='transit';
  }
  return cat||'other';
};
const migrateExpenseCats=()=>{
  if(CFG.catMigrV2)return;
  let n=0;
  (S.fin.expenses||[]).forEach(e=>{
    const txt=String(e.note||'');
    if((!e.cat||e.cat==='other')&&FOOD_RE.test(txt)){e.cat='food';n++;}
    else if((!e.cat||e.cat==='other')&&TRANSIT_RE.test(txt)){e.cat='transit';n++;}
  });
  if(n>0)saveLoc();
  saveCfg({...CFG,catMigrV2:true});
  if(n>0)setTimeout(()=>toast('已自动修正 '+n+' 条历史分类'),600);
};

  try{
    const dn=g.subtasks?.filter(s=>s.done).length||0,tot=g.subtasks?.length||0;

const scTypeLabel=t=>({focus:'专注',meeting:'会议/社交',rest:'休息/缓冲',life:'生活事项'})[t]||'事项';
const scTimeMins=t=>{const[h='0',m='0']=(t||'').split(':');return(+h||0)*60+(+m||0);};
const scOccurs=(e,date)=>date>=e.date&&date<=(e.endDate||e.date);
const scBusyInfo=date=>{
  const ranges=(S.sch?.events||[]).filter(e=>scOccurs(e,date)&&e.start).map(e=>[Math.max(420,scTimeMins(e.start)),Math.min(1380,scTimeMins(e.end)||scTimeMins(e.start)+60)]).filter(([s,e])=>e>s).sort((a,b)=>a[0]-b[0]);
  let busy=0,conflicts=0,end=420;
  ranges.forEach(([s,e])=>{if(s<end)conflicts++;if(e>end){busy+=e-Math.max(s,end);end=e;}});
  return{busy,free:Math.max(0,960-busy),conflicts};
};
const scDayLayout=date=>{
  const list=(S.sch?.events||[]).filter(e=>scOccurs(e,date)&&e.start).sort((a,b)=>scTimeMins(a.start)-scTimeMins(b.start));
  const ends=[],out={};
  list.forEach(e=>{const s=scTimeMins(e.start),en=scTimeMins(e.end)||s+60;let lane=ends.findIndex(x=>x<=s);if(lane<0)lane=ends.length;ends[lane]=en;out[e.id]={lane};});
  const count=Math.max(1,ends.length);Object.values(out).forEach(x=>x.count=count);return out;
};

const scDragDelta=ev=>({rawX:ev.clientX-scDrag.x,rawY:ev.clientY-scDrag.y,days:Math.round((ev.clientX-scDrag.x)/(scDrag.dayW||132)),mins:Math.round((ev.clientY-scDrag.y)/14)*15});
const scClearDragPreview=()=>document.querySelectorAll(`.tl-event[data-eid="${scDrag?.id||''}"]`).forEach(el=>{el.classList.remove('dragging');el.style.transform='';el.style.height='';const x=el.querySelector('.tl-resize-x');if(x)x.style.transform='';});
const scDragStart=(ev,id,mode)=>{ev.stopPropagation();ev.preventDefault();const e=(S.sch.events||[]).find(x=>x.id===id);if(!e)return;const dayW=ev.currentTarget.closest('.tl-day-body')?.getBoundingClientRect().width||132;scDrag={id,mode,x:ev.clientX,y:ev.clientY,dayW,date:e.date,endDate:e.endDate||e.date,start:scTimeMins(e.start),end:scTimeMins(e.end)||scTimeMins(e.start)+60,moved:false};document.body.style.userSelect='none';document.addEventListener('mousemove',scDragMove);document.addEventListener('mouseup',scDragEnd,{once:true});};
const scDragMove=ev=>{
  if(!scDrag)return;
  const d=scDragDelta(ev),els=[...document.querySelectorAll(`.tl-event[data-eid="${scDrag.id}"]`)];
  if(Math.abs(d.rawX)+Math.abs(d.rawY)>3)scDrag.moved=true;
  els.forEach(el=>{
    el.classList.add('dragging');
    if(scDrag.mode==='move')el.style.transform=`translate(${d.rawX}px,${d.rawY}px)`;
    if(scDrag.mode==='duration')el.style.height=`${Math.max(28,el.offsetHeight+d.rawY)}px`;
    if(scDrag.mode==='span'){const x=el.querySelector('.tl-resize-x');if(x)x.style.transform=`translateX(${d.rawX}px)`;}
  });

const scRecurrenceDates=(start,rule,count=10,interval=1,until='')=>{
  const out=[start];let d=start,guard=0;
  while(out.length<Math.min(100,Math.max(1,count))&&guard++<500){
    const n=Math.max(1,+interval||1);
    if(rule==='daily')d=addDays(d,n);
    else if(rule==='weekdays'){for(let i=0;i<n;i++)do{d=addDays(d,1);}while(!isChinaWorkday(d));}
    else if(rule==='weekly')d=addDays(d,7*n);
    else if(rule==='monthly'){const x=parseDay(d);x.setMonth(x.getMonth()+n);d=localISO(x);}
    else if(rule==='yearly'){const x=parseDay(d);x.setFullYear(x.getFullYear()+n);d=localISO(x);}
    else break;
    if(until&&d>until)break;
    out.push(d);
  }
  return out;
};

  const btn=document.getElementById('snext');if(btn){btn.textContent='连接中…';btn.disabled=true;}
  try{const url=`${sd.fbUrl.replace(/\/$/,'')}/tracker/${sd.sk}.json`;const r=await fetch(url);if(r.status===401||r.status===403)throw new Error('权限被拒，请确认 Firebase 规则设为测试模式');if(!r.ok)throw new Error(`HTTP ${r.status}`);step=3;rSetupP();}
  catch(e){alert('❌ 连接失败：\n'+e.message);if(btn){btn.textContent='测试连接并继续 →';btn.disabled=false;}}
};
const setupSkip=()=>{sd.fbUrl='';sd.sk='';step=3;rSetupP();};
const setupFinish=async()=>{
  const finance={gross:+sd.gross||12515,hf:+sd.hf||12,specialDeduction:+sd.specialDeduction||0,socialBase:+sd.socialBase||0,hfBase:+sd.hfBase||0,employmentStart:'2026-06-03',trial:'2026-12-03'};
  saveCfg({fbUrl:sd.fbUrl||'',key:sd.sk||'',aiKey:sd.aiKey||'',oai:!!sd.oai,...finance,lastExport:toDay(),_done:true});
  const local=loadLoc();if(local)S=local;
  S.set={...S.set,...finance};
  S.fin.budget.income=S.fin.budget.income||calcSal(finance.gross,toDay(),true,finance).net;
  if(fbU()){
    try{
      const rem=await fbGet();
      if(rem&&rem._ts){
        const d=initD();
        S={fin:{...d.fin,...rem.fin},learn:{...d.learn,...rem.learn},work:{...d.work,...rem.work},sch:{...d.sch,...rem.sch},life:{...d.life,...rem.life},cdns:rem.cdns||[],set:{...d.set,...rem.set},_ts:rem._ts};
        saveLoc();
      }else await sUp();
    }catch(e){toast('Firebase 连接失败：'+e.message,5000);}
  }
  renderApp();
};

// ── Personal feedback ──────────────────────────────────────
let qBusy=false;
const activityDates=()=>new Set([
  ...(S.fin?.expenses||[]).map(x=>x.date),
  ...(S.work?.logs||[]).map(x=>x.date),
  ...(S.work?.todos||[]).filter(x=>x.done).map(x=>x.date),
  ...(S.sch?.events||[]).filter(x=>x.done).map(x=>x.date),
].filter(Boolean));
const activityStreak=()=>{const set=activityDates();let d=toDay(),n=0;if(!set.has(d))d=addDays(d,-1);while(set.has(d)){n++;d=addDays(d,-1);}return n;};
const personalSnapshot=()=>{
  const goals=[];
  const td=toDay(),week=weekBounds(),month=(S.fin?.expenses||[]).filter(e=>e.date?.startsWith(curMo())),weekRows=(S.fin?.expenses||[]).filter(e=>e.date>=week.start&&e.date<=week.end),doneEvents=(S.sch?.events||[]).filter(e=>e.done&&e.date===td).length,doneWork=(S.work?.todos||[]).filter(t=>t.done&&t.date===td).length,wishes=(S.fin?.wishlist||[]).map(w=>({name:w.name,gap:Math.max(0,(+w.price||0)-(+w.saved||0))}));
  return{date:td,streak:activityStreak(),todayCompleted:doneEvents+doneWork,weekAccountingDays:new Set(weekRows.map(x=>x.date)).size,monthRecords:month.length,goals,wishes};
};
const personalPulse=()=>{
  const s=personalSnapshot(),wish=s.wishes.sort((a,b)=>a.gap-b.gap)[0],goal=s.goals.find(g=>g.total&&g.done<g.total);
  if(s.todayCompleted)return{q:`今天已经完成 ${s.todayCompleted} 项，继续保持这个节奏。`,a:`连续记录 ${s.streak} 天`};
  if(s.weekAccountingDays>=3)return{q:`这周已经记账 ${s.weekAccountingDays} 天，你正在把钱花到哪里变得清楚。`,a:`连续记录 ${s.streak} 天`};
  if(wish&&wish.gap>0)return{q:`距离「${wish.name}」还差 ${fm(wish.gap)}，今天的一次克制会让它更近。`,a:'来自愿望目标'};
  if(goal)return{q:`「${goal.title}」已经完成 ${goal.done}/${goal.total}，今天推进一个小步骤就很好。`,a:'来自学习目标'};
  return{q:'今天先完成一件真正重要的小事。',a:s.streak?`连续记录 ${s.streak} 天`:'从今天开始'};
};
const onRefreshQ=async()=>{
  if(qBusy)return;
  if(!CFG.aiKey){toast('设置 AI Key 后，可基于你的数据生成个性化反馈');return;}
  qBusy=true;renderApp();
  try{const data=JSON.stringify(personalSnapshot());const text=await callAI([{role:'user',content:data}],'你是克制、真诚的个人成长伙伴。根据用户真实数据写一句不超过45字的中文反馈：具体提到一个真实进展或下一步，不喊口号，不使用感叹号，只输出一句话。');S.set.personalNote={date:toDay(),text};save();}catch(e){toast('生成失败：'+e.message);}qBusy=false;renderApp();
};

// ── Reminder ──────────────────────────────────────────────
let rdDate='';
const eventReminderHits=new Set();
const notificationStateLabel=()=>typeof Notification==='undefined'?'不支持':Notification.permission==='granted'?'已授权':Notification.permission==='denied'?'已拒绝':'未授权';
const enableNotifications=async()=>{if(typeof Notification==='undefined'){toast('当前浏览器不支持系统通知');return;}const result=await Notification.requestPermission();renderApp();toast(result==='granted'?'系统通知已授权':'未获得系统通知权限');};
const notify=(title,body)=>{toast(`${title}：${body}`,5000);if(typeof Notification!=='undefined'&&Notification.permission==='granted')try{new Notification(title,{body});}catch{}};
const testNotification=()=>notify('成长追踪测试','提醒通道工作正常；关闭页面后仍需推送后端。');
setInterval(()=>{
  const now=new Date();
  const ts=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const td=toDay();
  if(CFG.remind&&ts===CFG.remind&&rdDate!==td){rdDate=td;notify('💰 记账提醒','今天有新的支出，别忘了记下来！');}
  (S.sch?.events||[]).filter(e=>!e.done&&e.date&&e.start&&+e.remind>0).forEach(e=>{
    const start=new Date(`${e.date}T${e.start}:00`),at=new Date(start.getTime()-(+e.remind*60000)),key=`${e.id}:${e.date}:${e.start}`;
    if(now>=at&&now<start&&start-now<=+e.remind*60000&&!eventReminderHits.has(key)){eventReminderHits.add(key);notify('⏰ 日程提醒',`${e.title} 将在 ${e.remind} 分钟后开始`);}
  });
},30000);

// ── Today Dashboard ───────────────────────────────────────
const goTab=t=>{TAB=t;if(t==='fin'){fView='main';fPan=null;}if(t==='sch'&&scMobile()){scRangeStart=toDay();scRangeDays=1;scScrollX=0;}renderApp();};
const currentIncome=()=>{
  const gs=+(S.set.gross??12515);
  return calcSal(gs,toDay(),true,S.set).net;
};
const onboardingSteps=()=>[
  {label:'写下一个明确的下一步',done:(S.work.todos||[]).length>0,action:"wPan='manage';goTab('work')",button:'添加下一步'},
  {label:'把一件事放进时间轴',done:(S.sch.events||[]).length>0,action:"goTab('sch')",button:'打开时间轴'},
  {label:'记下第一笔真实资金流动',done:(S.fin.expenses||[]).length>0,action:"goTab('fin')",button:'记第一笔'}
];
const dismissOnboarding=()=>{S.set.onboardingDismissed=true;save();renderApp();};
const rOnboarding=()=>{
  const steps=onboardingSteps(),done=steps.filter(x=>x.done).length;
  if(S.set.onboardingDismissed||done===steps.length)return'';
  return`<div class="card up" style="border-left:3px solid var(--fi)"><div class="section-head"><div><div class="shd">开始使用 <span class="soft-status">${done}/${steps.length}</span></div></div><button class="btn omi xs" onclick="dismissOnboarding()">不再显示</button></div>${steps.map(x=>`<div class="row"><span style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${x.done?'var(--gr)':'var(--sf2)'};color:${x.done?'#fff':'var(--t3)'};font-size:11px;flex-shrink:0">${x.done?'✓':'○'}</span><div style="flex:1;font-size:13px;color:${x.done?'var(--t3)':'var(--t1)'};text-decoration:${x.done?'line-through':'none'}">${x.label}</div>${x.done?'':`<button class="btn omi xs" onclick="${x.action}">${x.button}</button>`}</div>`).join('')}</div>`;
};
const rHome=()=>{
  const td=toDay(),allPending=(S.work.todos||[]).filter(t=>!t.done).sort((a,b)=>(a.prio||2)-(b.prio||2)||(a.date||'9999').localeCompare(b.date||'9999')),todayWork=allPending.filter(t=>!t.date||t.date<=td),wkPending=(S.work.wkGoals||[]).filter(g=>!g.done),workNext=todayWork[0]||allPending[0],pendingWorkCount=allPending.length+wkPending.length;
  const events=(S.sch?.events||[]).filter(e=>scOccurs(e,td)).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99')),pendingEvents=events.filter(e=>!e.done&&e.showAs!=='free'),scheduledTodoIds=new Set(pendingEvents.map(e=>e.todoId).filter(Boolean)),todayPendingCount=pendingEvents.length+todayWork.filter(t=>!scheduledTodoIds.has(t.id)).length;
  const bi=scBusyInfo(td),monthRows=(S.fin.expenses||[]).filter(e=>e.date?.startsWith(curMo())),fp=finPlan(S.fin.budget,currentIncome(),monthRows);
  return `${rOnboarding()}${rCountdownBlock()}${rCdnModal()}<div class="module-hero home up">
    <div class="module-kicker">今日总览</div>
    <div class="metric-grid">
      <div class="metric"><div class="num">${(bi.free/60).toFixed(1)}h</div><div class="lbl">07:00–23:00 空闲</div></div>
      <div class="metric"><div class="num">${todayPendingCount}</div><div class="lbl">今日待完成</div></div>
      <div class="metric"><div class="num" style="color:${fp.extraLeft<0?'var(--re)':'inherit'}">${fp.hasIncome?fm(Math.abs(fp.extraLeft)):'—'}</div><div class="lbl">${fp.extraLeft>=0?'还能花':'已超支'}</div></div>
    </div>
  </div>
  <div class="card up">
    <div class="section-head"><div><div class="shd">今天的时间</div><div class="section-note">${bi.conflicts?bi.conflicts+' 个时间冲突需要处理':'当前没有时间冲突'}</div></div><button class="btn osc xs" onclick="goTab('sch')">打开时间轴</button></div>
    ${events.length?events.slice(0,5).map(e=>`<div class="row"><input type="checkbox" ${e.done?'checked':''} onchange="scToggleDone('${e.id}')"><div style="width:52px;font-size:11px;font-weight:800;color:var(--sc);flex-shrink:0">${e.start||'全天'}${e.end?'<br>'+e.end:''}</div><div style="flex:1"><div style="font-size:13px;font-weight:700;text-decoration:${e.done?'line-through':'none'}">${esc(e.title)}</div><div class="sub">${scTypeLabel(e.type)}${e.remind?' · ⏰提前'+e.remind+'分钟':''}</div></div><button class="btn omi xs" onclick="scEditEv('${e.id}')">编辑</button></div>`).join(''):`<div class="empty" style="padding:12px 0">今天还没有时间块</div>`}
  </div>
  <div class="card up">
      <div class="section-head"><div><div class="shd">工作下一步</div><div class="section-note">只看最重要的一件</div></div><button class="btn owo xs" onclick="goTab('work')">查看</button></div>
      ${workNext?`<div style="font-size:14px;font-weight:800;line-height:1.5">${esc(workNext.text)}</div><div class="sub">${workNext.date&&workNext.date<td?'已逾期 · ':workNext.date===td?'今天 · ':workNext.date?'计划 '+fd(workNext.date)+' · ':'未定日期 · '}全部还有 ${pendingWorkCount} 项</div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn owo xs" onclick="wSchedule('${workNext.id}')">排进日程</button><button class="btn wo xs" onclick="wTogT('${workNext.id}')">完成</button></div>`:wkPending[0]?`<div style="font-size:14px;font-weight:800;line-height:1.5">${esc(wkPending[0].text)}</div><div class="sub">本周目标 · 全部还有 ${pendingWorkCount} 项</div><button class="btn owo xs" onclick="goTab('work')" style="margin-top:10px">前往工作板块</button>`:`<div class="empty" style="padding:12px 0">没有待办</div>`}
  </div>
  `;
};

// ── Main Render ───────────────────────────────────────────
let TAB='home';
const renderApp=()=>{
  if(TAB==='learn'||TAB==='life')TAB='home';
  const q=S.set.personalNote?.date===toDay()?{q:S.set.personalNote.text,a:'基于今日数据'}:personalPulse();
  const qText=q.q||'';
  const qAuth=q.a||'';
  document.getElementById('app').innerHTML=`
  <div class="brand-head" style="background:#fff;padding:max(22px,env(safe-area-inset-top,22px)) 16px 18px;color:#182230;border-bottom:1px solid #e6eaf0;box-shadow:0 6px 20px rgba(15,23,42,.04)">
    <div style="max-width:1040px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:11px"><img class="brand-mark" src="./app-icon-192.png" alt=""><div><div class="brand-date" style="font-size:11px;color:var(--t2);margin-bottom:2px">${dlbl()}</div><div class="brand-title" style="font-size:22px;font-weight:700">个人成长追踪</div></div></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
          <span id="sbg"></span>
          <button class="brand-settings" onclick="setD={...CFG,...S.set};showSet=true;renderApp()" style="cursor:pointer;font-family:inherit" title="设置" aria-label="设置"><span class="brand-icon"><i data-lucide="settings"></i></span></button>
        </div>
      </div>
      <div class="quote-strip" style="background:#f8fafc;border-radius:10px;padding:12px 14px;border:1px solid #e6eaf0">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <span class="quote-icon" style="flex-shrink:0;margin-top:1px"><i data-lucide="sparkles"></i></span>
          <div style="flex:1;min-width:0">
            <div class="quote-text" style="font-size:13px;color:#334155;line-height:1.5">${qText}</div>
            ${qAuth?`<div class="quote-author" style="font-size:11px;color:var(--t3);margin-top:4px;text-align:right">— ${qAuth}</div>`:''}
          </div>
          <button class="quote-refresh" onclick="onRefreshQ()" ${qBusy?'disabled':''} style="background:none;border:none;cursor:pointer;padding:0;line-height:1;flex-shrink:0;margin-top:1px" title="更新今日反馈">${qBusy?'…':'<i data-lucide="refresh-cw"></i>'}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="top-nav">
    <div style="max-width:1040px;margin:0 auto;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch">
      ${TABS.map(t=>`<button class="nav-tab ${TAB===t.id?'active':''}" onclick="goTab('${t.id}')" style="--tab-color:${t.c}"><span class="nav-icon"><i data-lucide="${t.i}"></i></span><span>${t.l}</span></button>`).join('')}
    </div>
  </div>
  <div style="max-width:1040px;margin:0 auto;padding:14px 12px 80px">
    ${TAB==='home'?rHome():TAB==='fin'?(fView==='main'?rFinMain():`<div class="advanced-head"><button class="btn omi sm" onclick="fView='main';fPan=null;renderApp()">← 返回财务首页</button><span class="soft-status">更多财务工具</span></div>${rFin()}`):TAB==='learn'?rLearn():TAB==='work'?rWork():TAB==='sch'?rSch():rLife()}
  </div>
  ${showSet?rSetModal():''}${rScCtx()}`;
  rBadge();
  if(window.lucide)setTimeout(()=>lucide.createIcons(),0);
  if(TAB==='sch'&&scV==='timeline')setTimeout(scRestoreTimeline,0);
};

// ── Init ──────────────────────────────────────────────────
(async()=>{
  CFG=loadCfg();
  if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  if(!CFG._done){
    const local=loadLoc();if(local)S=local;
    document.getElementById('app').innerHTML=rSetup();
    return;
  }
  const local=loadLoc();
  if(local){
    const d=initD();
    S={fin:{...d.fin,...(local.fin||local.finance||{})},learn:{...d.learn,...(local.learn||local.learning||{})},work:{...d.work,...(local.work||{})},sch:{...d.sch,...(local.sch||{})},life:{...d.life,...(local.life||{})},cdns:local.cdns||[],set:{...d.set,...(local.set||{})},_ts:local._ts||Date.now()};
    if(S.work.weeklyGoals&&!S.work.wkGoals)S.work.wkGoals=S.work.weeklyGoals;
  }
  if(CFG.gross!=null)S.set.gross=CFG.gross;
  if(CFG.hf)S.set.hf=CFG.hf;
  if(CFG.specialDeduction!=null)S.set.specialDeduction=CFG.specialDeduction;
  if(CFG.socialBase!=null)S.set.socialBase=+CFG.socialBase||0;
  if(CFG.hfBase!=null)S.set.hfBase=+CFG.hfBase||0;
  if(CFG.employmentStart)S.set.employmentStart=CFG.employmentStart;
  if(CFG.trial)S.set.trial=CFG.trial;
  migrateFinanceBuckets();
  if(!S.set.employmentStart)S.set.employmentStart='2026-06-03';
  if(!S.set.trial||S.set.trial==='2026-09-01')S.set.trial='2026-12-03';
  if(!CFG.employmentStart||CFG.trial==='2026-09-01'||!CFG.lastExport){CFG={...CFG,employmentStart:S.set.employmentStart,trial:S.set.trial,lastExport:CFG.lastExport||toDay()};saveCfg(CFG);}
  saveLoc();
  // Init quote if empty
  if(!S.set.quote)S.set.quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  migrateExpenseCats();
  renderApp();
  checkBackupReminder();
  await sDn();
  document.addEventListener('click',()=>{if(scCtx){scCtx=null;renderApp();}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sDn();});
})();
</script>
